# Asset bridge manifest.
#
# Maps a file name inside a player-supplied copy of the original Mo' Creatures to the texture path
# this mod expects. Matching is on base name only and is case-insensitive, so the directory layout
# inside the original archive does not matter (it differs between versions, and the original's own
# download nests everything one level down inside mods/MoCreatures.zip).
#
# This mod ships none of these images. The bridge only reads a copy the player already has on disk.
# Adding a mob is a one-line edit here; no code change is needed.
#
#   <original file name> = <path inside the generated texture pack>
#
# The right-hand side may be a comma-separated list, which points one original at several paths.
# That is for the places where this port splits a mob into states the original drew with a single
# skin -- taming a kitty never changed its coat -- and it is always spelled out in a comment rather
# than left to look like four unrelated cats.
#
# --- This file and model-bridge.properties -------------------------------------------------------
# Every entry below is also listed against a mob in model-bridge.properties, which converts that
# mob's geometry out of the same archive and writes these same files. That is deliberate, not
# duplication for its own sake: not one model this repo ships shares a UV layout with the original it
# stands in for (checked cube by cube -- the overlap is zero), so a skin bridged onto this repo's own
# geometry renders as garbage. A texture is only safe here because the geometry travels with it.
#
# The two exceptions are boar and duck, at the bottom, and they are marked.
#
# Names below were taken from v2.12.2 for Beta 1.7.3 and every one was checked against the archive.
# Where the original's own file name is misleading it is noted -- 'bearb' is the angry bear, not a
# second bear, and 'miceg' is the default grey mouse.

# --- Bear -------------------------------------------------------------------
# The 'b' suffix is the angry pass, which the original drew over the calm bear from RenderBear.
bear.png                = assets/creatures/textures/entity/bear/0.png
bearb.png               = assets/creatures/textures/entity/bear_angry/0.png
polarbear.png           = assets/creatures/textures/entity/bear_polar/0.png
polarbearb.png          = assets/creatures/textures/entity/bear_polar_angry/0.png

# --- Deer -------------------------------------------------------------------
# deerb is the buck and deerf the doe. The archive also has a plain deer.png, which is the pre-2.10
# single-sex deer and is not what this port's renderer asks for, so it is not mapped.
deerb.png               = assets/creatures/textures/entity/deer/b_0.png
deerf.png               = assets/creatures/textures/entity/deer/f_0.png

# --- Bird -------------------------------------------------------------------
# Six colours. The index order is this port's own, taken from MobBird's call sounds so that a bird's
# skin and its voice agree.
birdblack.png           = assets/creatures/textures/entity/bird/0.png
birdblue.png            = assets/creatures/textures/entity/bird/1.png
birdgreen.png           = assets/creatures/textures/entity/bird/2.png
birdred.png             = assets/creatures/textures/entity/bird/3.png
birdwhite.png           = assets/creatures/textures/entity/bird/4.png
birdyellow.png          = assets/creatures/textures/entity/bird/5.png

# --- Kitty ------------------------------------------------------------------
# The original's cats are pussycata..h -- eight of them. This port has four skin slots, each with a
# tamed and an untamed path, and taming never changed a cat's coat in the original, so each skin
# feeds both of its paths. pussycate..j are left on the floor: there is nowhere here to put them.
pussycata.png           = assets/creatures/textures/entity/kitty/0.png, \
                          assets/creatures/textures/entity/kitty/tamed_0.png
pussycatb.png           = assets/creatures/textures/entity/kitty/1.png, \
                          assets/creatures/textures/entity/kitty/tamed_1.png
pussycatc.png           = assets/creatures/textures/entity/kitty/2.png, \
                          assets/creatures/textures/entity/kitty/tamed_2.png
pussycatd.png           = assets/creatures/textures/entity/kitty/3.png, \
                          assets/creatures/textures/entity/kitty/tamed_3.png

# --- Big cats ---------------------------------------------------------------
# Lions and lionesses share one body texture in the original; the mane is a separate layer drawn only
# over grown males, which is what lionb.png is. (lionc.png, the blank the original drew over every
# other cat to suppress that layer, has no equivalent here -- the layer is simply skipped.)
lionf.png               = assets/creatures/textures/entity/bigcat_lion/0.png
lionb.png               = assets/creatures/textures/entity/bigcat_mane/0.png
tiger.png               = assets/creatures/textures/entity/bigcat_tiger/0.png
tigerw.png              = assets/creatures/textures/entity/bigcat_tiger_white/0.png
panther.png             = assets/creatures/textures/entity/bigcat_panther/0.png
cheetah.png             = assets/creatures/textures/entity/bigcat_cheetah/0.png
leopard.png             = assets/creatures/textures/entity/bigcat_leopard/0.png

# --- Rats -------------------------------------------------------------------
# ratb is the ordinary brown rat, ratbl the black one, ratw the white one and rath the hell rat.
ratb.png                = assets/creatures/textures/entity/rat/0.png
ratbl.png               = assets/creatures/textures/entity/rat_black/0.png
ratw.png                = assets/creatures/textures/entity/rat_white/0.png
rath.png                = assets/creatures/textures/entity/rat_hell/0.png

# --- Mice -------------------------------------------------------------------
# miceg is the default grey mouse, not a green one.
miceg.png               = assets/creatures/textures/entity/mouse/0.png
miceb.png               = assets/creatures/textures/entity/mouse_brown/0.png
micew.png               = assets/creatures/textures/entity/mouse_white/0.png

# --- Dolphins ---------------------------------------------------------------
# Six colours; the first has no number in the original.
dolphin.png             = assets/creatures/textures/entity/dolphin/0.png
dolphin2.png            = assets/creatures/textures/entity/dolphin/1.png
dolphin3.png            = assets/creatures/textures/entity/dolphin/2.png
dolphin4.png            = assets/creatures/textures/entity/dolphin/3.png
dolphin5.png            = assets/creatures/textures/entity/dolphin/4.png
dolphin6.png            = assets/creatures/textures/entity/dolphin/5.png

# --- Fish -------------------------------------------------------------------
# Ten varieties, numbered from 1 in the original and from 0 here.
fishy1.png              = assets/creatures/textures/entity/fishy/0.png
fishy2.png              = assets/creatures/textures/entity/fishy/1.png
fishy3.png              = assets/creatures/textures/entity/fishy/2.png
fishy4.png              = assets/creatures/textures/entity/fishy/3.png
fishy5.png              = assets/creatures/textures/entity/fishy/4.png
fishy6.png              = assets/creatures/textures/entity/fishy/5.png
fishy7.png              = assets/creatures/textures/entity/fishy/6.png
fishy8.png              = assets/creatures/textures/entity/fishy/7.png
fishy9.png              = assets/creatures/textures/entity/fishy/8.png
fishy10.png             = assets/creatures/textures/entity/fishy/9.png

# --- Shark and the eggs -----------------------------------------------------
# The 't' suffix is the entity texture; the bare sharkegg.png and fishyegg.png are the 16x16 item
# icons and are not what the egg entities draw with.
shark.png               = assets/creatures/textures/entity/shark/0.png
sharkeggt.png           = assets/creatures/textures/entity/shark_egg/0.png
fishyeggt.png           = assets/creatures/textures/entity/fishy_egg/0.png

# --- Ogres ------------------------------------------------------------------
# The 'b' files are the second pass the original drew over each ogre and have no slot here.
ogre.png                = assets/creatures/textures/entity/ogre/0.png
fireogre.png            = assets/creatures/textures/entity/ogre_fire/0.png
caveogre.png            = assets/creatures/textures/entity/ogre_cave/0.png

# --- Werewolf, human form ---------------------------------------------------
# Only the man is bridged. The beast shares its geometry with the pack wolf in this port, and the
# original painted werewolf.png and wolfa.png for two different models, so neither can be placed on
# one shared shape. See model-bridge.properties.
werehuman.png           = assets/creatures/textures/entity/werewolf/0.png

# --- Wraiths ----------------------------------------------------------------
wraith.png              = assets/creatures/textures/entity/wraith/0.png
flamewraith.png         = assets/creatures/textures/entity/wraith_flame/0.png

# --- Boar and duck ----------------------------------------------------------
# The two exceptions to the rule at the top of this file, and they are a judgement call rather than
# a clean win. The original gave neither its own model -- the boar rendered on Minecraft's ModelPig
# and the duck on ModelChicken -- so there is no class in the archive to convert, and this art is
# painted for those vanilla layouts rather than for the geometry this port draws them with. It is
# mapped anyway because this repo ships no boar or duck texture at all, so the alternative is not
# this port's own art, it is the missing-texture checkerboard. Expect the right colours in roughly
# the wrong places.
boar.png                = assets/creatures/textures/entity/boar/0.png
duck.png                = assets/creatures/textures/entity/duck/0.png

# --- Not mapped, and why ----------------------------------------------------
# fox_angry, fox_arctic, fox_arctic_angry -- v2.12.2 has fox.png and nothing else. There is no
#   arctic fox in this version, so there is nothing to point at. fox.png itself is not mapped either:
#   without the other three the fox's geometry is held back, and a lone skin on this repo's own fox
#   would be worse than leaving it alone.
# bunny, bunny_tamed -- the archive has 4 skins (bunny, bunnyb..d) and this port declares 5, so the
#   fifth would fall back to this repo's art on the original's box layout.
# horse/0..4, horse/saddle, horse/saddle_4 -- the original splits a horse across horse<colour>a.png
#   (body, tail, legs) and horse<colour>b.png (head, neck, ears, and the horn or wings), painted for
#   two separate models. This port draws one model with one combined skin, which neither half fits.
#   For the record, the colour that carries the horn is gold (type 4, the unicorn) and the one that
#   carries the wings is white (type 5, the pegasus).
# litterbox/1 -- the original had one litterbox.png and swapped between a Litter and a LitterUsed box
#   on it, so there is no second, filthy skin to bridge.
# werewolf_beast, werewolf_wolf -- see the werewolf note above.
