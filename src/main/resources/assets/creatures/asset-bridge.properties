# Asset bridge manifest.
#
# Maps a file name inside a player-supplied copy of the original Mo' Creatures to the texture path
# this mod expects. Matching is on base name only and is case-insensitive, so the directory layout
# inside the original archive does not matter (it differs between versions).
#
# This mod ships none of these images. The bridge only reads a copy the player already has on disk.
# Adding a mob is a one-line edit here; no code change is needed.
#
#   <original file name> = <path inside the generated texture pack>

# --- Bear -------------------------------------------------------------------
bear.png                = assets/creatures/textures/entity/bear/0.png
bearangry.png           = assets/creatures/textures/entity/bear_angry/0.png
polarbear.png           = assets/creatures/textures/entity/bear_polar/0.png
polarbearangry.png      = assets/creatures/textures/entity/bear_polar_angry/0.png

# --- Fox --------------------------------------------------------------------
fox.png                 = assets/creatures/textures/entity/fox/0.png
foxangry.png            = assets/creatures/textures/entity/fox_angry/0.png
arcticfox.png           = assets/creatures/textures/entity/fox_arctic/0.png
arcticfoxangry.png      = assets/creatures/textures/entity/fox_arctic_angry/0.png

# --- Bunny ------------------------------------------------------------------
bunny.png               = assets/creatures/textures/entity/bunny/0.png
bunnytamed.png          = assets/creatures/textures/entity/bunny_tamed/0.png

# --- Boar (no built-in texture ships with this mod) --------------------------
boar.png                = assets/creatures/textures/entity/boar/0.png

# --- Duck (no built-in texture ships with this mod) --------------------------
duck.png                = assets/creatures/textures/entity/duck/0.png

# --- Horse family -----------------------------------------------------------
horse.png               = assets/creatures/textures/entity/horse/0.png
unicorn.png             = assets/creatures/textures/entity/horse_unicorn/0.png
pegasus.png             = assets/creatures/textures/entity/horse_pegasus/0.png

# --- Kitty ------------------------------------------------------------------
kitty.png               = assets/creatures/textures/entity/kitty/0.png
litterbox.png           = assets/creatures/textures/entity/litterbox/0.png

# --- Deer -------------------------------------------------------------------
deer.png                = assets/creatures/textures/entity/deer/0.png
