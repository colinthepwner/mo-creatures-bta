# Model bridge manifest.
#
# Maps an entity model class inside a player-supplied copy of the original Mo' Creatures to the
# Bedrock geometry this mod loads. Matching is on the class's base name only and is case-insensitive,
# so the directory layout inside the original archive does not matter.
#
# This mod ships none of the original's geometry. The bridge only reads a copy the player already has
# on disk and writes the converted result into their generated texture pack. Adding a mob is an edit
# here; no code change is needed.
#
#   <id>.source   = original model class, without .class
#   <id>.overlay  = a second class the original draws as an extra layer over the first with the same
#                   texture, merged into one set of bones; omit when there is none
#   <id>.base     = 'quadruped' or 'biped' when the original extends one of Minecraft's own model
#                   classes, whose boxes are built outside the archive; '-' when it is self-contained
#   <id>.vanilla  = 'pig' or 'chicken' when the original had no class of its own and rendered the mob
#                   straight on one of Minecraft's own models. There is nothing in the archive to
#                   read, so the whole model is reconstructed from the Bedrock geometry BTA ships,
#                   exactly as a base layer is. Used instead of <id>.source, not alongside it.
#   <id>.args     = constructor arguments the original's own renderer passes, when it does not use
#                   the no-argument constructor
#   <id>.uv-size  = the UV space the original's texture offsets are expressed in, when it is not
#                   ModelBase's 64x32 default. Derived from the offsets themselves, not from the PNG:
#                   the original ships double-resolution art, so a 128x64 file is usually still a
#                   64x32 layout. Only a model whose offsets do not fit 64x32 needs this.
#   <id>.textures = <original png> = <path in the pack>, comma separated. EVERY texture the mob's
#                   renderers load has to be listed. Naming one original twice is allowed and points
#                   it at both paths. See "Why textures are listed here" below.
#   <id>.bones    = <original field> = <bone name this mod's renderers ask for>, comma separated.
#                   '<field> = -' drops a bone the original builds but never draws.
#                   '<field> = name@parent' also parents it, so posing the parent carries it along.
#                   The originals have no hierarchy -- every box is drawn about its own rotation
#                   point -- so the converter divides the parent's rest transform back out and the
#                   bone stays exactly where it was. Reattaching is free; see MMGeometryBridge.
#
# Geometry lands at assets/creatures/models/entity/<id>.json inside the generated pack, which is
# exactly where MobRenderer.setModel looks, so the converted model replaces the built-in one.
#
# --- Why textures are listed here ---------------------------------------------------------------
# The original's textures are painted against the original's box layout. Converted geometry only
# looks right on the art it was drawn for, so a mob is converted if and only if the archive supplies
# every texture that mob needs; otherwise the original's box layout would land on this repo's own
# art, which looks worse than leaving both alone. The bridge writes the listed textures itself, so
# geometry and art can never come from different places.
#
# This matters more than it looks. Not one model this repo ships shares a UV layout with the original
# it stands in for -- they are independent reimplementations, checked cube by cube against every
# model class in v2.12.2 and overlapping on nothing. So bridging a skin without also converting the
# geometry is not a partial win, it is garbage on the screen, and the pairing rule above is the only
# thing keeping that from happening.
#
# --- Left and right ------------------------------------------------------------------------------
# The original's own leg and wing field names are not a reliable guide -- ModelRat calls the leg at
# x = +3 'FrontL' while ModelBird calls the leg at x = -2 'leftleg'. Sides below are taken from the
# rotation point instead, matching the base layer this port reconstructs, where -x is left and -z is
# front. The walk cycle is diagonal either way, so a mob whose sides were mirrored would still step
# correctly; this only keeps the names honest.
#
# --- Held back, and why --------------------------------------------------------------------------
# These are not converter limits. It reads all 27 model classes in v2.12.2 cleanly, with no failures.
#   fox              -- v2.12.2 ships fox.png and nothing else. This port draws fox_angry,
#                       fox_arctic and fox_arctic_angry too, and the archive has no source for any of
#                       them: there is no arctic fox in this version at all. Its built-in fox set is
#                       complete and consistent, so it stays built-in on purpose.
#   bunny            -- the archive has 4 skins (bunny, bunnyb..d); this port's variants.json declares
#                       5, so one bunny in five would fall back to this repo's own art on the
#                       original's box layout. Built-in on purpose, same as the fox.
#
# Everything else in this port is converted. The four that used to sit here are dealt with rather
# than worked around, and each is worth reading as a pattern:
#   boar, duck       -- vanilla-derived, see <id>.vanilla above.
#   horse            -- two halves, two models, two layers.
#   werewolf_wolf    -- the pack wolf and the werewolf's beast form are two separate geometries now.
#   litterbox        -- one image, two boxes, driven by bone visibility.

# --- The archive's own ModelRenderer ------------------------------------------------------------
# Field names on Minecraft's ModelRenderer are obfuscated and version-specific, so they are named
# here rather than in code. Verified against v2.12.2 for Beta 1.7.3: ModelBunny's setRotationAngles
# assigns head pitch to 'd' and head yaw to 'e', which fixes the rotation triple, and the models set
# 'g' around addBox calls, which is the mirror flag.
renderer.point-x  = a
renderer.point-y  = b
renderer.point-z  = c
renderer.rotate-x = d
renderer.rotate-y = e
renderer.rotate-z = f
renderer.mirror   = g

# --- Minecraft's own base classes ---------------------------------------------------------------
# Field slots of the base class, in declaration order, matched to the bones the converter
# reconstructs for it. A subclass that assigns one of these is replacing that bone rather than
# adding one. Confirmed for this archive: ModelBear2 writes its head into 'd' carrying exactly
# vanilla ModelCow's head box, and ModelKitty writes into 'b' with the +0.5 inflate that only the
# biped's headwear has.
base.quadruped.slots = d, e, f, g, h, i
base.biped.slots     = a, b, c, d, e, f, g

# --- Bear -------------------------------------------------------------------
# RenderBear draws ModelBear2 on bear.png and ModelBear1 over it on bearb.png. That second pass was
# read here as an "angry coat" -- a state this port has no equivalent for -- and dropped. It is not.
# EntityBear contains exactly one texture string, /mob/bear.png, assigned in its constructor and
# never swapped, so bearb.png is only ever the overlay. And RenderBear's condition is the same shape
# as the ogre's and the wolf's, 'pass == 0 && !bearboolean', with bearboolean false at construction
# and only ever set from a saved NBT tag -- so the pass always draws.
#
# What it carries is the bear's ears: ModelBear1's head slot is addBox(-5, -8, -2, 10, 4, 1), one
# flat 10x4x1 plate across the top of the head at the head's own rotation point, and its body slot is
# a small 4x2x4 box. Without the pass a bear simply has no ears, which is what was being seen.
#
# ModelBear2's head and body replace vanilla ModelQuadruped's; the legs are the inherited vanilla
# ones, and the same is true of ModelBear1, whose inherited legs are dropped below -- bearb.png
# carries the ear plate and nothing to wrap a leg in.
bear.source   = ModelBear2
bear.base     = quadruped
bear.textures = bear.png        = assets/creatures/textures/entity/bear/0.png, \
                bearb.png       = assets/creatures/textures/entity/bear_angry/0.png, \
                polarbear.png   = assets/creatures/textures/entity/bear_polar/0.png, \
                polarbearb.png  = assets/creatures/textures/entity/bear_polar_angry/0.png
bear.bones    = b = snout@head

# The second pass. Its head slot is the ear plate and its body slot a small patch of fur; the four
# inherited quadruped legs are dropped, because bearb.png is blank everywhere they would sample.
bear_over.source   = ModelBear1
bear_over.base     = quadruped
bear_over.textures = bearb.png      = assets/creatures/textures/entity/bear_angry/0.png, \
                     polarbearb.png = assets/creatures/textures/entity/bear_polar_angry/0.png
bear_over.bones    = f = -, g = -, h = -, i = -

# --- Deer -------------------------------------------------------------------
# deer_moc, not deer: Bedrock geometry identifiers are one flat namespace shared by every pack, and
# BTA ships a deer of its own under geometry.deer. Whichever loaded last used to win, so this mob
# and the vanilla one took turns wearing each other's boxes. The id is the file name in the pack,
# the entry in its model manifest and the identifier inside the geometry, all three.
deer_moc.source   = ModelDeer
deer_moc.base     = -
deer_moc.textures = deerb.png = assets/creatures/textures/entity/deer/b_0.png, \
                    deerf.png = assets/creatures/textures/entity/deer/f_0.png
deer_moc.bones    = Head = head, Body = body, Neck = neck, Tail = tail, \
                    LEar = earLeft@head, REar = earRight@head, \
                    LeftAntler = antlerLeft@head, RightAntler = antlerRight@head, \
                    Leg1 = legRightFront, Leg2 = legLeftFront, \
                    Leg3 = legRightBack, Leg4 = legLeftBack

# --- Bird -------------------------------------------------------------------
# Six colours, and which is which is fixed by this port's own numbering rather than guessed: MobBird
# picks its call sound from the same index, black through yellow, so the skin and the voice agree.
# The duck borrows this geometry and is not converted with it -- see the held-back list.
bird.source   = ModelBird
bird.base     = -
bird.textures = birdblack.png  = assets/creatures/textures/entity/bird/0.png, \
                birdblue.png   = assets/creatures/textures/entity/bird/1.png, \
                birdgreen.png  = assets/creatures/textures/entity/bird/2.png, \
                birdred.png    = assets/creatures/textures/entity/bird/3.png, \
                birdwhite.png  = assets/creatures/textures/entity/bird/4.png, \
                birdyellow.png = assets/creatures/textures/entity/bird/5.png
bird.bones    = head = head, beak = beak@head, body = body, tail = tail, \
                rwing = wingLeft, lwing = wingRight, \
                leftleg = legLeft, rightleg = legRight
# The +x leg and wing. ModelBird gives both sides the same box and the same texture offset and never
# touches the mirror field, so the pair is distinguished only by the convention BTA's own conversion
# follows: the bone at +x carries Bedrock's mirror flag, because Bedrock unwraps those faces the
# other way round. Its cow.geo.json does exactly this on leg1 and leg3 while vanilla ModelQuadruped
# sets no mirror at all. Without it the toes on that foot read back to front.
#
# Deliberately scoped to the bird for now. 63 of the 85 +x cubes across the bridged set are in the
# same position, but that is a change to every mob's UVs and this one is the test case.
# (bird.mirror is no longer needed here: mirrorRightHandSide applies the same rule to every model.)

# --- Kitty ------------------------------------------------------------------
# ModelKitty is a ModelBiped subclass that replaces all seven slots, so nothing vanilla survives
# except the headwear stub, which is a 1x1x1 dot and is dropped. Its nine bipedHeadParts are the
# ears, brows, cheeks, nose and muzzle; the original drew them all at once and rotated them with the
# head, which is what parenting them reproduces.
# The original drew eight cats (pussycata..h) and taming never changed a cat's coat, so each tamed
# path takes the same skin as the untamed one it belongs to. That leaves pussycate..j unused: this
# port has four skin slots, not eight.
# RenderKitty is built with 'new ModelKitty(0.0F, 15.0F)', and the second argument is not decoration:
# every one of ModelKitty's own rotation points is written as '0 + f1', so without it the whole cat is
# built fifteen units too high in Java space and floats a block off the ground. The no-argument
# constructor the reader would otherwise start from delegates with f1 = 0, which is the bug.
# No uv-size override: like every other model here, its offsets are in ModelBase's own 64x32 space.
kitty.source   = ModelKitty
kitty.base     = biped
kitty.args     = 0, 15
kitty.textures = pussycata.png = assets/creatures/textures/entity/kitty/0.png, \
                 pussycatb.png = assets/creatures/textures/entity/kitty/1.png, \
                 pussycatc.png = assets/creatures/textures/entity/kitty/2.png, \
                 pussycatd.png = assets/creatures/textures/entity/kitty/3.png, \
                 pussycata.png = assets/creatures/textures/entity/kitty/tamed_0.png, \
                 pussycatb.png = assets/creatures/textures/entity/kitty/tamed_1.png, \
                 pussycatc.png = assets/creatures/textures/entity/kitty/tamed_2.png, \
                 pussycatd.png = assets/creatures/textures/entity/kitty/tamed_3.png
kitty.bones    = b = -, bipedTail = tail, \
                 d = legLeftFront, e = legRightFront, f = legLeftBack, g = legRightBack, \
                 bipedHeadParts[0] = earLeft@head, bipedHeadParts[1] = earRight@head, \
                 bipedHeadParts[2] = browLeft@head, bipedHeadParts[3] = browRight@head, \
                 bipedHeadParts[4] = cheekLeft@head, bipedHeadParts[5] = cheekRight@head, \
                 bipedHeadParts[6] = nose@head, bipedHeadParts[7] = ruff@head, \
                 bipedHeadParts[8] = muzzle@head

# --- Big cats ---------------------------------------------------------------
# Lions and lionesses share one body texture in the original; the mane is a separate layer drawn only
# over grown males, which this port loads as its own model. The Collar box is dropped: the original
# only drew it on a tamed cat and this port has no state for it.
bigcat.source   = ModelBigCat2
bigcat.base     = -
bigcat.textures = lionf.png   = assets/creatures/textures/entity/bigcat_lion/0.png, \
                  panther.png = assets/creatures/textures/entity/bigcat_panther/0.png, \
                  cheetah.png = assets/creatures/textures/entity/bigcat_cheetah/0.png, \
                  tiger.png   = assets/creatures/textures/entity/bigcat_tiger/0.png, \
                  leopard.png = assets/creatures/textures/entity/bigcat_leopard/0.png, \
                  tigerw.png  = assets/creatures/textures/entity/bigcat_tiger_white/0.png
bigcat.bones    = head = head, body = body, Tail = tail, Collar = -, \
                  ears = ears@head, snout = snout@head, \
                  leg1 = legLeftBack, leg2 = legRightBack, \
                  leg3 = legLeftFront, leg4 = legRightFront

# The mane pass. ModelBigCat1 only replaces vanilla ModelQuadruped's head and body, so the four
# inherited legs are dropped -- a mane layer that kept them would draw a second set of legs in mane
# colours over the cat.
bigcat_maned.source   = ModelBigCat1
bigcat_maned.base     = quadruped
bigcat_maned.textures = lionb.png = assets/creatures/textures/entity/bigcat_mane/0.png
bigcat_maned.bones    = f = -, g = -, h = -, i = -

# --- Rats -------------------------------------------------------------------
rat.source   = ModelRat
rat.base     = -
rat.textures = ratb.png  = assets/creatures/textures/entity/rat/0.png, \
               ratbl.png = assets/creatures/textures/entity/rat_black/0.png, \
               ratw.png  = assets/creatures/textures/entity/rat_white/0.png
rat.bones    = Head = head, Body = body, Tail = tail, BodyF = bodyFront@body, \
               EarL = earRight@head, EarR = earLeft@head, \
               WhiskerL = whiskerRight@head, WhiskerR = whiskerLeft@head, \
               FrontL = legRightFront, FrontR = legLeftFront, \
               RearL = legRightBack, RearR = legLeftBack

# The hell rat is the same shape in a different skin, exactly as the original had it: RenderHellRat
# is built with another ModelRat.
rat_hell.source   = ModelRat
rat_hell.base     = -
rat_hell.textures = rath.png = assets/creatures/textures/entity/rat_hell/0.png
rat_hell.bones    = Head = head, Body = body, Tail = tail, BodyF = bodyFront@body, \
                    EarL = earRight@head, EarR = earLeft@head, \
                    WhiskerL = whiskerRight@head, WhiskerR = whiskerLeft@head, \
                    FrontL = legRightFront, FrontR = legLeftFront, \
                    RearL = legRightBack, RearR = legLeftBack

# --- Mice -------------------------------------------------------------------
# ModelMouse has no Body box at all -- BodyF is the whole torso.
mouse.source   = ModelMouse
mouse.base     = -
mouse.textures = miceg.png = assets/creatures/textures/entity/mouse/0.png, \
                 miceb.png = assets/creatures/textures/entity/mouse_brown/0.png, \
                 micew.png = assets/creatures/textures/entity/mouse_white/0.png
mouse.bones    = Head = head, BodyF = body, Tail = tail, \
                 EarL = earRight@head, EarR = earLeft@head, \
                 WhiskerL = whiskerRight@head, WhiskerR = whiskerLeft@head, \
                 FrontL = legRightFront, FrontR = legLeftFront, \
                 RearL = legRightBack, RearR = legLeftBack

# --- Dolphin ----------------------------------------------------------------
# MobRendererDolphin already looks for the original's own names before its own, so PTail and
# UpperFin are left alone; the two tail fins are renamed onto the LTail/RTail it also accepts.
dolphin.source   = ModelDolphin
dolphin.base     = -
dolphin.textures = dolphin.png  = assets/creatures/textures/entity/dolphin/0.png, \
                   dolphin2.png = assets/creatures/textures/entity/dolphin/1.png, \
                   dolphin3.png = assets/creatures/textures/entity/dolphin/2.png, \
                   dolphin4.png = assets/creatures/textures/entity/dolphin/3.png, \
                   dolphin5.png = assets/creatures/textures/entity/dolphin/4.png, \
                   dolphin6.png = assets/creatures/textures/entity/dolphin/5.png
dolphin.bones    = Body = body, UHead = head, DHead = jaw@head, \
                   LTailFin = LTail@PTail, RTailFin = RTail@PTail, \
                   LeftFin = finLeft@body, RightFin = finRight@body

# --- Shark ------------------------------------------------------------------
# Every bone MobRendererShark looks for -- PTail, UpperTailFin, LowerTailFin, UHead, LHead, RHead --
# is already the original's own name, so only the torso is renamed.
#
# The two tail fins are hung off the tail stock, which the original does not do: ModelShark uses no
# addChild at all and every part is placed absolutely. Without that they are PTail's siblings, and
# the only two ways to drive a flat tail are both wrong -- swing the stock and the fins stay behind
# it, or swing only the fins and the body never moves at all. Parented, the stock can carry them, so
# the tail reads as one piece that flexes. The original only ever turned the two fins, so this is a
# deliberate departure, and it is the same one the dolphin's LTail/RTail already make below.
shark.source   = ModelShark
shark.base     = -
shark.textures = shark.png = assets/creatures/textures/entity/shark/0.png
shark.bones    = Body = body, LeftFin = finLeft@body, RightFin = finRight@body, \
                 UpperTailFin = UpperTailFin@PTail, LowerTailFin = LowerTailFin@PTail

# --- Eggs -------------------------------------------------------------------
# One box each, and the original drew both with the same ModelSharkEgg.
shark_egg.source   = ModelSharkEgg
shark_egg.base     = -
shark_egg.textures = sharkeggt.png = assets/creatures/textures/entity/shark_egg/0.png
shark_egg.bones    = Egg = body

fishy_egg.source   = ModelSharkEgg
fishy_egg.base     = -
fishy_egg.textures = fishyeggt.png = assets/creatures/textures/entity/fishy_egg/0.png
fishy_egg.bones    = Egg = body

# --- Fishy ------------------------------------------------------------------
fishy.source   = ModelFishy
fishy.base     = -
fishy.textures = fishy1.png  = assets/creatures/textures/entity/fishy/0.png, \
                 fishy2.png  = assets/creatures/textures/entity/fishy/1.png, \
                 fishy3.png  = assets/creatures/textures/entity/fishy/2.png, \
                 fishy4.png  = assets/creatures/textures/entity/fishy/3.png, \
                 fishy5.png  = assets/creatures/textures/entity/fishy/4.png, \
                 fishy6.png  = assets/creatures/textures/entity/fishy/5.png, \
                 fishy7.png  = assets/creatures/textures/entity/fishy/6.png, \
                 fishy8.png  = assets/creatures/textures/entity/fishy/7.png, \
                 fishy9.png  = assets/creatures/textures/entity/fishy/8.png, \
                 fishy10.png = assets/creatures/textures/entity/fishy/9.png
fishy.bones    = Body = body, Tail = tail

# --- Ogres ------------------------------------------------------------------
# An ogre is two models, like the horse: RenderOgre draws ModelOgre2 as the main model on ogre.png
# and ModelOgre1 over it on ogreb.png, and the second pass is not optional decoration -- it carries
# the ogre's head and its torso. ModelOgre2's own head slot is a 1x1x1 dot and its body is the
# shoulder yoke; on its own it draws a headless ogre. So both halves are converted and this port's
# ogre renderer draws them as two layers, exactly as MobRendererHorse draws horse and horse_head.
#
# Each replaces six of ModelBiped's seven slots and puts something of its own in an eighth field, so
# in both the leftover vanilla headwear is dropped. The pass condition in the original reads
# 'pass == 0 && !ogreboolean', so the flag suppresses the second pass rather than enabling it, and
# nothing but a saved NBT tag ever sets it. It is false on every ogre that was not loaded from such
# a tag, so the second pass draws always and unconditionally here.
#
# The eighth field is treated differently in the two halves, and the difference is not arbitrary.
# RenderOgre draws the main model through ModelOgre2's own render(FFFFFFZ), which lists its extra
# field explicitly, so ModelOgre2's is kept. It draws the second pass through the inherited
# ModelBase.render(FFFFFF) -- ModelOgre1 declares no such override -- which resolves to ModelBiped's,
# and that renders ModelBiped's seven fields and nothing else. ModelOgre1's crest is therefore never
# drawn by the original at all, and its texture region on ogreb.png is blank, so it is dropped.
ogre.source   = ModelOgre2
ogre.base     = biped
ogre.textures = ogre.png = assets/creatures/textures/entity/ogre/0.png
ogre.bones    = b = -, h = headTop@head

ogre_over.source   = ModelOgre1
ogre_over.base     = biped
ogre_over.textures = ogreb.png = assets/creatures/textures/entity/ogre/b_0.png
ogre_over.bones    = b = -, d = -, e = -, h = -

ogre_fire.source   = ModelOgre2
ogre_fire.base     = biped
ogre_fire.textures = fireogre.png = assets/creatures/textures/entity/ogre_fire/0.png
ogre_fire.bones    = b = -, h = headTop@head

ogre_fire_over.source   = ModelOgre1
ogre_fire_over.base     = biped
ogre_fire_over.textures = fireogreb.png = assets/creatures/textures/entity/ogre_fire/b_0.png
ogre_fire_over.bones    = b = -, d = -, e = -, h = -

ogre_cave.source   = ModelOgre2
ogre_cave.base     = biped
ogre_cave.textures = caveogre.png = assets/creatures/textures/entity/ogre_cave/0.png
ogre_cave.bones    = b = -, h = headTop@head

ogre_cave_over.source   = ModelOgre1
ogre_cave_over.base     = biped
ogre_cave_over.textures = caveogreb.png = assets/creatures/textures/entity/ogre_cave/b_0.png
ogre_cave_over.bones    = b = -, d = -, e = -, h = -

# --- Wraiths ----------------------------------------------------------------
# ModelWraith puts the visible 8x8x8 head in ModelBiped's headwear slot and leaves a 1x1x1 dot in the
# head slot, at a texture offset of v=40 that falls outside the 64x32 wraith.png entirely. Dropping
# the dot and promoting the real box to 'head' is what the original actually drew, and it brings the
# UV extent back to exactly 64x32 so no uv-size override is needed.
wraith.source   = ModelWraith
wraith.base     = biped
wraith.textures = wraith.png = assets/creatures/textures/entity/wraith/0.png
wraith.bones    = a = -, b = head

wraith_flame.source   = ModelWraith
wraith_flame.base     = biped
wraith_flame.textures = flamewraith.png = assets/creatures/textures/entity/wraith_flame/0.png
wraith_flame.bones    = a = -, b = head

# --- Werewolf, human form ---------------------------------------------------
# ModelWereHuman adds no boxes of its own: the original's untransformed werewolf is Minecraft's biped
# wearing a player-shaped skin, which is what werehuman.png is. The reconstructed base layer already
# carries the bone names this port's biped renderer asks for, so there is nothing to rename.
werewolf.source   = ModelWereHuman
werewolf.base     = biped
werewolf.textures = werehuman.png = assets/creatures/textures/entity/werewolf/0.png

# --- Werewolf, beast form ---------------------------------------------------
# The port used to draw the beast and the pack wolf on one shared geometry, which neither
# werewolf.png nor wolfa.png fitted. They are two models in the original and they are two here now.
# ModelWerewolf is a chain of absolutely-placed segments rather than a hierarchy, so the trunk pieces
# and the shins are parented to the parts this port poses; otherwise a hunch would rotate the chest
# out from under the rest and the walk cycle would leave the shins standing where they were.
# 'Right' and 'Left' in the original are not a guide -- RightEar sits at +x while RightArm's box sits
# at -x -- so, as everywhere else here, the side is taken from where the box actually is.
werewolf_beast.source   = ModelWerewolf
werewolf_beast.base     = -
werewolf_beast.textures = werewolf.png = assets/creatures/textures/entity/werewolf_beast/0.png
werewolf_beast.bones    = Head = head, RightEar = earRight@head, LeftEar = earLeft@head, \
                          Torso = body, Torso2 = rump@body, Abdomen = belly@body, \
                          RightArm = armLeft, LeftArm = armRight, \
                          RightTigh = legLeft, LeftTigh = legRight, \
                          RightLeg = shinLeft@legLeft, LeftLeg = shinRight@legRight, \
                          Tail = tail

# --- Pack wolf --------------------------------------------------------------
# Two models, two layers, exactly like the ogre and the horse. ModelWolf2 -- the main model, on
# wolfa.png -- is a ModelQuadruped subclass at legLength 10 that replaces the head and body and adds
# a snout of its own; the four legs are the inherited vanilla ones. ModelWolf1 -- the second pass, on
# wolfb.png -- replaces the same two slots with a 10x14x3 neck plate and a 12x8x8 shoulder ruff, and
# keeps the vanilla legs as a fur overlay.
#
# The second pass is not decoration: ModelWolf2's head sits two units clear of the front of its body
# and six units above it, and what closes that gap is ModelWolf1's neck plate, which lands squarely
# between them. Drawing only the first is a wolf with a floating head, which is exactly what this
# used to do. RenderWWolf's pass condition reads 'pass == 0 && !wolfboolean' -- the flag suppresses
# the pass rather than enabling it -- and nothing but a saved NBT tag ever sets it, so the pass
# draws always and unconditionally here, the same arrangement RenderOgre uses.
#
# Verified in game against a real v2.12.2 archive: with both passes drawing, head, neck plate,
# shoulder ruff and body are contiguous. The finished wolf carries its head high on the shoulders
# rather than forward on a neck, because ModelWolf2's head spans y 14..22 against a body at y 10..16.
# It also has no tail: neither ModelWolf1 nor ModelWolf2 declares one and neither does the
# ModelQuadruped they extend. Both are the original's shape, not losses in conversion, so neither is
# something to "correct" here.
werewolf_wolf.source   = ModelWolf2
werewolf_wolf.base     = quadruped
werewolf_wolf.textures = wolfa.png = assets/creatures/textures/entity/werewolf_wolf/0.png
werewolf_wolf.bones    = b = snout@head, \
                         f = legBackLeft, g = legBackRight, h = legFrontLeft, i = legFrontRight

werewolf_wolf_over.source   = ModelWolf1
werewolf_wolf_over.base     = quadruped
werewolf_wolf_over.textures = wolfb.png = assets/creatures/textures/entity/werewolf_wolf/b_0.png
werewolf_wolf_over.bones    = f = legBackLeft, g = legBackRight, h = legFrontLeft, i = legFrontRight

# --- Boar and duck ----------------------------------------------------------
# Neither has a class in the archive: EntityBoar rendered on Minecraft's ModelPig and EntityDuck on
# ModelChicken. Their art is painted for those vanilla layouts, which is exactly what the converter
# already reconstructs for the composed models, so it is reconstructed for the whole model here and
# the pairing rule holds unchanged -- the geometry still ships only with the art it was painted for.
# ModelChicken has no tail; MobRendererDuck's tail tilt simply finds no bone and does nothing.
boar.vanilla  = pig
boar.textures = boar.png = assets/creatures/textures/entity/boar/0.png
boar.bones    = legLeftFront = legFrontLeft, legRightFront = legFrontRight, \
                legLeftBack = legBackLeft, legRightBack = legBackRight

duck.vanilla  = chicken
duck.textures = duck.png = assets/creatures/textures/entity/duck/0.png
duck.bones    = beak = beak@head, wattle = wattle@head

# --- Horses -----------------------------------------------------------------
# The original splits a horse across two models drawn as two passes with two textures: ModelHorse2
# (body, tail, legs) on horse<colour>a.png, and ModelHorse1 (head, neck, ears, horn, wings) on
# horse<colour>b.png, which is the main model and carries the entity texture. Both halves are
# converted and this port's horse renderers draw them as two layers, the way MobRendererBigCat
# already draws the lion's mane.
#
# One ModelHorse1 served every horse in the original: the horn and the wings are always built, and on
# a plain horse's b-sheet the pixels they sample are simply blank. That is why the unicorn's horn and
# the pegasus's wings need no separate shape -- only their own colour's texture. The horn is a
# zero-width box, a flat billboard, and converts as one.
#
# Colours are matched to this port's variants through EntityHorse.chooseType: type 1 is the plain
# horse, 2 brown, 3 black, 4 gold (the unicorn), 5 white (the pegasus), 6 the pack horse, 7 the
# nightmare and 8 the black pegasus. The saddled sheets carry no geometry of their own -- they are a
# straight swap for the body sheet -- so they appear in asset-bridge.properties and not here.
# Bag1/Bag2 are the pack horse's panniers, which the original only drew on a chested horse. They are
# dropped on every horse that cannot take a chest, and kept on the two that can.
horse.source   = ModelHorse2
horse.base     = -
horse.textures = horsea.png      = assets/creatures/textures/entity/horse/0.png, \
                 horsebrowna.png = assets/creatures/textures/entity/horse/1.png, \
                 horseblacka.png = assets/creatures/textures/entity/horse/2.png
horse.bones    = Body = body, Tail = tail, \
                 Leg1 = legBackRight, Leg2 = legBackLeft, \
                 Leg3 = legFrontRight, Leg4 = legFrontLeft

horse_head.source   = ModelHorse1
horse_head.base     = -
horse_head.textures = horseb.png      = assets/creatures/textures/entity/horse/b_0.png, \
                      horsebrownb.png = assets/creatures/textures/entity/horse/b_1.png, \
                      horseblackb.png = assets/creatures/textures/entity/horse/b_2.png
horse_head.bones    = Head = head, Neck = neck, \
                      Ear1 = earRight@head, Ear2 = earLeft@head, Unicorn = horn@head, \
                      RightWing = wingLeft, LeftWing = wingRight, \
                      Bag1 = -, Bag2 = -

horse_unicorn.source   = ModelHorse2
horse_unicorn.base     = -
horse_unicorn.textures = horsegolda.png = assets/creatures/textures/entity/horse/3.png
horse_unicorn.bones    = Body = body, Tail = tail, \
                         Leg1 = legBackRight, Leg2 = legBackLeft, \
                         Leg3 = legFrontRight, Leg4 = legFrontLeft

horse_unicorn_head.source   = ModelHorse1
horse_unicorn_head.base     = -
horse_unicorn_head.textures = horsegoldb.png = assets/creatures/textures/entity/horse/b_3.png
horse_unicorn_head.bones    = Head = head, Neck = neck, \
                              Ear1 = earRight@head, Ear2 = earLeft@head, Unicorn = horn@head, \
                              RightWing = wingLeft, LeftWing = wingRight, \
                              Bag1 = -, Bag2 = -

horse_pegasus.source   = ModelHorse2
horse_pegasus.base     = -
horse_pegasus.textures = horsewhitea.png = assets/creatures/textures/entity/horse/4.png
horse_pegasus.bones    = Body = body, Tail = tail, \
                         Leg1 = legBackRight, Leg2 = legBackLeft, \
                         Leg3 = legFrontRight, Leg4 = legFrontLeft

horse_pegasus_head.source   = ModelHorse1
horse_pegasus_head.base     = -
horse_pegasus_head.textures = horsewhiteb.png = assets/creatures/textures/entity/horse/b_4.png
horse_pegasus_head.bones    = Head = head, Neck = neck, \
                              Ear1 = earRight@head, Ear2 = earLeft@head, Unicorn = horn@head, \
                              RightWing = wingLeft, LeftWing = wingRight, \
                              Bag1 = -, Bag2 = -

# --- Litter box -------------------------------------------------------------
# Not a mob, but the same problem: the original had one litterbox.png and swapped a clean Litter box
# for a used LitterUsed one at the same place on the model, sampling a different part of the sheet.
# Both are converted and LitterboxRenderer hides whichever does not apply, the way the doe's antlers
# are hidden -- resetBones() puts them back every frame. This port's own second, filthy image is left
# unused while the converted model is in play, because there is nothing to paint it onto.
# The Bottom box's UV runs 12 pixels past the right edge of a 64-wide sheet and wraps, which is what
# the original did too; it is reproduced rather than corrected.
litterbox.source   = ModelLitterBox
litterbox.base     = -
litterbox.textures = litterbox.png = assets/creatures/textures/entity/litterbox/0.png
litterbox.bones    = Table1 = wallBack, Table3 = wallFront, \
                     Table2 = wallRight, Table4 = wallLeft, \
                     Bottom = bottom, Litter = litter, LitterUsed = litterUsed

